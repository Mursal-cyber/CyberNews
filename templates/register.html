
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CyberNews</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #102b50;
            color: white;
            text-align: center;
            padding: 50px 15px;
        }
        form {
            background: #194477;
            padding: 25px;
            max-width: 350px;
            margin: auto;
            border-radius: 12px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }
        button {
            background: #39b9e8;
            cursor: pointer;
            font-weight: bold;
        }
        a { color: #80dfff; }
    </style>
</head>
<body>
    <h1>CyberNews</h1>
    <h2>Create an Account</h2>

    <form method="POST" action="/register">
        <input type="text" name="username"
               placeholder="Username" required>

        <input type="password" name="password"
               placeholder="Password" required>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account?
        <a href="/login">Login here</a>
    </p>
    <p><a href="/">Back to Home</a></p>
</body>
</html>
